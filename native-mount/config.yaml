name: Native Mount
description: >-
  Mounts one or more configured block devices into the host filesystem using
  nsenter, then optionally runs post-mount shell commands (e.g. to start
  another add-on). Runs at the initialize stage so drives are ready before
  application-stage add-ons (like Frigate) start.
version: "0.4.0"
slug: native_mount
url: https://github.com/kael-shipman/ha-addon-native-mount
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: initialize
boot: auto

# full_access maps to Docker --privileged, which disables AppArmor/seccomp
# profiles that otherwise block nsenter from opening /proc/1/ns/mnt even when
# SYS_PTRACE and SYS_ADMIN are granted individually.
host_pid: true
full_access: true

# Needed to call `ha addons start/stop` via the Supervisor API
hassio_api: true
hassio_role: manager

options:
  mounts: []
  post_mount_ha_commands: []

schema:
  mounts:
    - device_uuid: str
      mount_point: str
      fstype: str?
      wait_timeout: int?
      on_success:
        - str?
      on_failure:
        - str?
  post_mount_ha_commands:
    - str?
