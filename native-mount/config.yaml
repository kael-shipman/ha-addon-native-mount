name: Native Mount
description: >-
  Mounts one or more configured block devices into the HA media directory,
  then optionally runs post-mount shell commands (e.g. to start another add-on).
  Runs at the initialize stage so drives are ready before application-stage
  add-ons (like Frigate) start.
version: "0.9.0"
slug: native_mount
url: https://github.com/kael-shipman/ha-addon-native-mount
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: initialize
boot: auto

# host_pid: /proc/1 refers to the host's PID 1, giving access to /proc/1/ns/mnt for nsenter.
# SYS_ADMIN: perform mount operations. SYS_PTRACE: open /proc/1/ns/mnt for nsenter.
# full_access: exposes host block devices + disables seccomp (needed for blkid + mount).
# apparmor: false disables the default AppArmor profile so nsenter can open /proc/1/ns/mnt.
host_pid: true
full_access: true
apparmor: false
privileged:
  - SYS_ADMIN
  - SYS_PTRACE

# /media and /share are bind-mounted with shared propagation by the HA Supervisor,
# so mounts done here propagate to the host and to other add-on containers.
map:
  - media:rw
  - share:rw

# Needed to call `ha addons start/stop` via the Supervisor API
hassio_api: true
hassio_role: manager

options:
  mounts: []
  post_mount_ha_commands: []

schema:
  mounts:
    - device_uuid: str
      mount_point: str
      fstype: str?
      wait_timeout: int?
      on_success:
        - str?
      on_failure:
        - str?
  post_mount_ha_commands:
    - str?
